name: Live Backend Integration

# Same path filters as ci.yml — website/docs/markdown-only changes do not need live
# DB containers. Concurrency cancels superseded PR runs so rapid pushes do not pile up.
on:
  pull_request:
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/website-*.yml"
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/website-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guardian-live-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: ${{ matrix.kind }} integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: postgres
            image: postgres:17
            port: 5432
            user: plusplus
            database: plusplus
          - kind: mysql
            image: mysql:8.4
            port: 3306
            user: root
            database: plusplus
          - kind: mariadb
            image: mariadb:11.8
            port: 3306
            user: root
            database: plusplus
          - kind: sqlserver
            image: mcr.microsoft.com/mssql/server:2022-latest
            port: 1433
            user: sa
            database: master
          - kind: cassandra
            image: cassandra:5.0
            port: 9042
            user: cassandra
            database: plusplus
            cql: true
          - kind: scylladb
            image: scylladb/scylla:6.2
            port: 9042
            user: ""
            database: plusplus
            cql: true

    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: plusplus
          POSTGRES_PASSWORD: "Plusplus-ci-2026!"
          POSTGRES_DB: plusplus
          MYSQL_ROOT_PASSWORD: "Plusplus-ci-2026!"
          MYSQL_ROOT_HOST: "%"
          MYSQL_DATABASE: plusplus
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Plusplus-ci-2026!"
          CASSANDRA_AUTHENTICATOR: PasswordAuthenticator
        ports:
          - "${{ matrix.port }}:${{ matrix.port }}"

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libdbus-1-dev

      - name: Create CQL smoke keyspace
        if: matrix.cql
        env:
          DATABASE_CONTAINER: ${{ job.services.database.id }}
          CQL_USER: ${{ matrix.user }}
          CQL_PASSWORD: "Plusplus-ci-2026!"
        run: |
          set -euo pipefail
          cqlsh_args=()
          if [ -n "$CQL_USER" ]; then
            cqlsh_args=(-u "$CQL_USER" -p "$CQL_PASSWORD")
          fi
          for attempt in $(seq 1 40); do
            if docker exec "$DATABASE_CONTAINER" cqlsh "${cqlsh_args[@]}" -e "CREATE KEYSPACE IF NOT EXISTS plusplus WITH replication = {'class': 'SimpleStrategy', 'replication_factor': 1}"; then
              exit 0
            fi
            echo "CQL server not ready (${attempt}/40)"
            sleep 3
          done
          echo "CQL server did not become ready" >&2
          exit 1

      - name: Verify live backend workflow
        env:
          PLUSPLUS_LIVE_KIND: ${{ matrix.kind }}
          PLUSPLUS_LIVE_HOST: 127.0.0.1
          PLUSPLUS_LIVE_PORT: ${{ matrix.port }}
          PLUSPLUS_LIVE_USER: ${{ matrix.user }}
          PLUSPLUS_LIVE_PASSWORD: "Plusplus-ci-2026!"
          PLUSPLUS_LIVE_DATABASE: ${{ matrix.database }}
          PLUSPLUS_LIVE_CONNECT_ATTEMPTS: 30
        run: cargo test -p plusplus-core --test live_backends -- --ignored --nocapture
