name: CI

# The gate between a commit and users' machines. The in-app updater installs whatever
# `release.yml` publishes, so anything that reaches a tag reaches every install on the
# next update check — this workflow is what makes that safe. `release.yml` calls it via
# `workflow_call` and refuses to build until it passes.
#
# Website-only changes skip it; those are covered by website-ci.yml. No `push: main`
# trigger — PRs already gate merges, and tags re-run this suite via `workflow_call`
# from release.yml, so a main+tag push would otherwise double the test matrix. The
# path filters apply to `pull_request` only. A release calls this workflow once
# per OS so packaging can start after Linux tests pass, while macOS/Windows
# tests still block publish.
on:
  pull_request:
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "**.md"
      - ".github/workflows/website-*.yml"
  workflow_call:
    inputs:
      runners:
        description: JSON array of GitHub-hosted runner labels
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
      run-clippy:
        description: Run the non-blocking clippy job
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # `inputs.runners` keeps parallel release calls (linux/macos/windows) from
  # cancelling each other; they share github.workflow + github.ref.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.runners || 'all' }}
  # Superseded pull-request runs are disposable; a release run is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.runners || '["ubuntu-latest", "macos-latest", "windows-latest"]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-${{ matrix.os }}

      # Windows Defender scanning every object file in target/ is a well-known
      # multi-x slowdown for MSVC + C++ (DuckDB) compiles on hosted runners.
      - name: Exclude the build tree from Windows Defender
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: scripts/linux-deps.sh

      # egui_kittest links wgpu, so the UI crate's tests expect a display server to exist
      # even though the snapshot tests that actually render are #[ignore]d. xvfb satisfies
      # that on a headless runner without having to weaken the suite.
      # --profile ci skips opt-level 2 on vendored C/C++ (see Cargo.toml).
      - name: Run tests
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace --locked --profile ci

      # --locked keeps CI honest about Cargo.lock: the tested dependency graph is exactly
      # the committed one, not whatever resolved fresh on the runner today.
      - name: Run tests
        if: runner.os != 'Linux'
        run: cargo test --workspace --locked --profile ci

      # Compile-check the Criterion harness once, on Linux. Repeating it on macOS
      # and Windows recompiles DuckDB + Criterion for no extra coverage — the
      # scheduled benchmark.yml workflow is what actually measures.
      - name: Compile performance benchmarks
        if: runner.os == 'Linux'
        run: cargo test -p plusplus-core --bench core_hot_paths --no-run --locked --profile ci

  clippy:
    name: Clippy
    if: ${{ inputs.run-clippy != false }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Reports but does not block yet: the tree currently has 10 clippy warnings (dead code
    # in grid.rs, a type_complexity in panels.rs, an incompatible_msrv, and some style
    # nits). Clear those, then delete this line to make `-D warnings` a real gate. Left
    # non-blocking rather than removed so the count is visible on every run and can only
    # go down. `test` is the blocking gate.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy-ci

      - name: Install native build dependencies
        run: scripts/linux-deps.sh

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked --profile ci -- -D warnings
